# CI gate (remediation v2, jackie-approved 2026-08-02): the full offline test
# suite — including the site-integrity, tier-registry, era, fact-check-
# exclusion, and published-pack invariant lints — runs on every PR and push
# to main. Live-provider tests are excluded by the project's default pytest
# marker config ('-m not live'); nothing here spends money or needs secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-asyncio
      - name: Test
        run: python -m pytest -q
