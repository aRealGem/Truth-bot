schema: truthbot-tier-registry v1
version: 2026-08-02

# ============================================================================
# THE versioned source of tier truth (remediation v2, item 1.2 / DC-2a).
#
# Supersedes source_tiers.json (quarantine/2026-08-02T2030Z/). Loaded by
# truthbot.verify.tier_registry; consumed through the source_tiers facade
# (classify_tier / classify_tier_ex) by pipeline AND renderer — one file,
# one implementation.
#
# Evaluation order (tier_registry.classify_tier_ex):
#   1. longest-suffix domain entry:
#        a. its ordered path_classes, first match wins (an explicit path_class
#           overrides every generic default),
#        b. entry semantics by tier/press:
#           - non-government tiers (political/wire/established/factcheck/other)
#             apply on ALL remaining paths,
#           - government + press=none  -> GOVERNMENT on all paths (protected
#             statistical/record function, DC-2a delta 2),
#           - government + press=established -> the nonpartisan carve-out:
#             stat data prefixes stay GOVERNMENT, stat press prefixes demote
#             to ESTABLISHED, default GOVERNMENT,
#           - government + press=demote (default) -> generic defaults apply:
#             data-hub host label / data segment -> GOVERNMENT, press prefix
#             or press segment -> POLITICAL, else GOVERNMENT,
#           - quarantine -> generic defaults apply (data yes, press no,
#             substantive prefixes survive), fallback POLITICAL. Used for
#             house.gov / senate.gov, whose member & committee subdomains are
#             partisan by construction.
#   2. unmapped .gov/.mil/.int host -> generic defaults (identical to the
#      quarantine pipeline), fallback POLITICAL with reason
#      "quarantine-unmapped-gov" (fail closed — S-6; .mil/.int used to fail
#      OPEN to GOVERNMENT, changed by DC-2a delta 3),
#   3. unmapped non-gov host -> OTHER ("unmapped-non-gov").
#
# Every entry carries a one-line rationale and a date. Extend consciously,
# not reflexively.
# ============================================================================

defaults:
  # "Data yes" (D7, jackie 2026-07-31): if ANY exact path segment is one of
  # these, the URL is structured data / statistical record and survives to
  # GOVERNMENT even nested under a press prefix (cbp.gov/newsroom/stats/...).
  # Exact-segment match, never substring.
  data_segments:
    [stats, statistics, data, dataset, datasets, timeseries, series, tables]

  # "Press no": press-shop path prefixes on a government-class host demote to
  # POLITICAL. Prefix match on the lowercased path start.
  # /news-releases and /opa/pr added 2026-08-02 (DC-2a delta 4: DOJ Office of
  # Public Affairs press releases live at justice.gov/opa/pr/*).
  press_prefixes:
    - /news/
    - /news-releases
    - /newsroom
    - /news-room
    - /press-releases
    - /press-release
    - /pressreleases
    - /press/
    - /media/press
    - /blog
    - /articles/
    - /statements
    - /remarks
    - /briefing
    - /opa/pr

  # Press-shop path SEGMENTS (exact match, any depth) — catches press releases
  # nested past the prefix rules: justice.gov/usao-dc/pr/*, ed.gov/about/news/
  # press-release/*, epa.gov/.../newsreleases/*. Checked AFTER data_segments
  # (data still wins) and only on demote/quarantine/unmapped pipelines.
  press_segments:
    [pr, press-release, press-releases, pressreleases, newsreleases]

  # Allowlist that survives the quarantine: paths carrying primary documents,
  # data, or statute rather than messaging (applies on quarantine entries and
  # unmapped gov-class hosts; a mapped government entry does not need it — its
  # fallback is already GOVERNMENT).
  substantive_prefixes:
    - /data
    - /datasets
    - /statistics
    - /stats
    - /publication
    - /publications
    - /report
    - /reports
    - /documents
    - /document
    - /bill
    - /bills
    - /legislative
    - /budget
    - /appropriations
    - /cfr
    - /uscode
    - /regulations
    - /rulemaking
    - /federal-register
    - /app/details
    - /content/pkg
    - /files
    - /pdf
    - /tables
    - /survey
    - /research
    - /programs
    - /about

  # Open-data hubs where the data signal is in the HOST, not the path (P129:
  # datahub.hhs.gov). Leading-label match only, never substring.
  data_hub_host_labels: [data, datahub, datasets, opendata, data-hub]

  # The nonpartisan carve-out's own lists (press=established entries): real
  # data on press-looking paths stays GOVERNMENT (bls.gov/news.release/* is
  # the monthly jobs report); a genuine press-shop path is ESTABLISHED —
  # demoted, not condemned.
  stat_data_prefixes:
    - /news.release
    - /newsreleases/archive
    - /opub
    - /cps
    - /ces
    - /data
    - /timeseries
    - /publication
    - /reports
    - /series
  stat_press_prefixes:
    - /newsroom
    - /press-releases
    - /bls/newsrels
    - /news/press
    - /media/releases
    - /news-events/news-releases

unknown:
  non_gov: other            # unmapped non-gov host -> OTHER (T6)
  gov_mil_int: quarantine   # unmapped .gov/.mil/.int -> QUARANTINE (fail closed; S-6)

