[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthbot"
version = "0.1.0"
description = "Automated political rhetoric fact-checker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jackie McLean" }]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "anthropic>=0.25",
    "openai>=1.0",
    "jinja2>=3.1",
    "feedgen>=0.9",
    "python-dateutil>=2.8",
    "diskcache>=5.6",
    "thefuzz>=0.20",
    "python-levenshtein>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pillow>=10.0",
    "google-generativeai>=0.8",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "black>=24.0",
    "ruff>=0.3",
]

[project.scripts]
truthbot = "truthbot.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# ``-m "not live"`` is the default so the smoke tests in ``tests/smoke/``
# never fire during ordinary ``pytest`` / CI runs. Opt in with
# ``pytest -m live`` when you actually want to burn real API budget.
# ``network`` rides the same convention for a different reason: those tests
# cost nothing, but they'd make the default suite an internet client.
addopts = "-m 'not live and not network'"
markers = [
    "live: hits real provider APIs and spends money; opt in via `pytest -m live`",
    # The DC-6' publish gate (A7). Runs by default AND is addressable on its
    # own as `pytest -m acceptance`, so the pre-publish check is one command.
    "acceptance: DC-6' acceptance gate — named regression cases over the staged rebuild artifacts",
    # Free and keyless (public ALFRED/BLS vintages), but still deselected by
    # default: CI should not be an internet client. Opt in via
    # `pytest -m network` to catch a silent upstream revision.
    "network: hits a free public data endpoint; opt in via `pytest -m network`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
